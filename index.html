<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    
    <!-- Header / Greeting Section -->
    <header class="card greeting-card">
      <div class="theme-toggle">
        <button id="theme-btn" class="btn-icon">🌙 Dark Mode</button>
      </div>
      <div class="time-display" id="time-display">00:00:00</div>
      <div class="date-display" id="date-display">Monday, January 1, 2026</div>
      <h1 class="greeting-text">
        <span id="greeting-time">Good Morning</span>, 
        <span id="user-name" class="editable-name" contenteditable="true" title="Klik untuk mengubah nama">User</span>
      </h1>
    </header>

    <!-- Main Content Grid -->
    <main class="grid-container">
      
      <!-- Focus Timer -->
      <section class="card timer-card">
        <h2>Focus Timer</h2>
        <div class="timer-display" id="timer-display">25:00</div>
        <div class="timer-controls">
          <button id="start-btn" class="btn btn-primary">Start</button>
          <button id="stop-btn" class="btn btn-secondary">Stop</button>
          <button id="reset-btn" class="btn btn-light">Reset</button>
        </div>
      </section>

      <!-- To-Do List -->
      <section class="card tasks-card">
        <h2>Tasks</h2>
        <form id="todo-form" class="input-group">
          <input type="text" id="todo-input" placeholder="Add a new task..." required>
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
        <p id="todo-error" class="error-msg"></p>
        <ul id="todo-list" class="task-list"></ul>
      </section>

      <!-- Quick Links -->
      <section class="card links-card">
        <h2>Quick Links</h2>
        <form id="link-form" class="input-group multi-input">
          <input type="text" id="link-name" placeholder="Link name" required>
          <input type="url" id="link-url" placeholder="URL (https://...)" required>
          <button type="submit" class="btn btn-primary">Add Link</button>
        </form>
        <div id="links-container" class="links-grid"></div>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
